name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and videos
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Build game
        env:
          PUBLIC_URL: /ef-game
          REACT_APP_GIT_COMMIT: ${{ github.sha }}
          GENERATE_SOURCEMAP: "false"
          # Keep warnings fatal in deployment so hook/lint regressions cannot
          # silently reach the clinical production site.
          CI: "true"
        run: npm run build

      - name: Add single-page app fallback
        shell: bash
        run: cp build/index.html build/404.html

      - name: Verify deployment size and assets
        run: npm run check:deploy

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
